document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (ROLE_SUBMIT[f.id]){ ROLE_SUBMIT[f.id](f); return; }
  if (f.id === 'f') saveForm(f);
  if (f.id === 'df'){
    const v = f.elements.v.value.trim(); const list = f.dataset.list; const i = f.dataset.i;
    const w = $('[data-k="v"]', f); let msg = '';
    if (!v) msg = 'Value is required';
    else if (db.lookups[list].some((it, n) => String(n) !== i && it.v.toLowerCase() === v.toLowerCase())) msg = 'This value already exists in the list';
    if (msg){ w.classList.add('invalid'); $('#e-v').innerHTML = ic('circle-alert') + esc(msg); icons(); f.elements.v.focus(); return; }
    const item = {v, a:f.elements.a.checked};
    if (i !== '') db.lookups[list][+i] = item; else db.lookups[list].push(item);
    formDirty = false; toast(`${v} saved`); go(f.dataset.back);
  }
  const fieldErr = (form, k, msg) => { const w = $(`[data-k="${k}"]`, form); w.classList.toggle('invalid', !!msg); const er = $(`#e-${k}`, form); if (er) er.innerHTML = msg ? ic('circle-alert') + esc(msg) : ''; return !!msg; };
  if (f.id === 'lf'){
    const label = f.elements.label.value.trim();
    const key = label.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    const bad = fieldErr(f, 'label', !label ? 'List name is required' : LOOKUP_META.some(l => l.key === key || l.label.toLowerCase() === label.toLowerCase()) ? 'A list with this name already exists' : '');
    icons(); if (bad){ f.elements.label.focus(); return; }
    LOOKUP_META.push({key, label, icon:'list', other:f.elements.other.checked}); db.lookups[key] = [];
    formDirty = false; toast(`${label} list created`); go('dropdowns?tab=' + key);
  }
  if (f.id === 'bf'){
    const loc = f.elements.local.value.trim(), out = f.elements.out.value.trim(), from = f.elements.from.value;
    const numErr = v => !v ? 'Rate is required' : (!/^\d+$/.test(v) || +v <= 0) ? 'Enter a whole rupee amount above 0' : '';
    const b1 = fieldErr(f, 'local', numErr(loc)), b2 = fieldErr(f, 'out', numErr(out));
    const b3 = fieldErr(f, 'from', !from ? 'Pick the date the new rates start' : db.betaRates.some(r => r.from === from) ? 'A rate already starts on this date' : Object.keys(db.betaFinal).some(m => from.slice(0, 7) <= m) ? 'That date falls in a finalised month. Reopen the month first.' : '');
    icons(); if (b1 || b2 || b3) return;
    db.betaRates.push({id:nid(), from, local:+loc, out:+out, note:f.elements.note.value.trim()});
    formDirty = false; toast(`New rates from ${fmtDate(from)} saved`); go('duties?tab=beta');
  }
});

/* ---------- role-app form submits ---------- */
const ROLE_SUBMIT = {
  loginFrm(){
    const a = FS.auth; const E = {}; const em = a.email.trim();
    if (!em) E.email = 'Enter your email'; else if (!/^\S+@\S+\.\S+$/.test(em)) E.email = 'Enter a valid email address';
    if (!a.pw) E.pw = 'Enter your password';
    if (!showErrors(a, E)) return;
    const low = em.toLowerCase();
    if (low === ADMIN_EMAIL) return doLogin('admin', null);
    const u = db.users.find(x => x.role !== 'manager' && (x.email || '').toLowerCase() === low);
    if (!u){ a.err = 'Email or password is incorrect.'; refresh(); return; }
    if (u.active === false){ a.err = 'Your account is inactive. Contact your LAIRON admin.'; refresh(); return; }
    if (u.role === 'staff'){ toast('Staff screens are the next step in this prototype.', 'info'); return; }
    doLogin(u.role, u.id);
  },
  phoneFrm(){
    const a = FS.auth;
    if (a.attempts >= 5){ a.err = 'Too many attempts. Please try again in 15 minutes.'; refresh(); return; }
    if (!showErrors(a, String(a.phone).length === 10 ? {} : {phone:'Enter your 10-digit mobile number'})) return;
    const u = db.users.find(x => x.role === 'manager' && x.phone === a.phone);
    if (!u || u.active === false){
      a.attempts++;
      a.err = a.attempts >= 5 ? 'Too many attempts. Please try again in 15 minutes.' : "We couldn't sign you in with this number. Check it, or ask your LAIRON admin to register it.";
      refresh(); return;
    }
    if (MANAGER_AUTH_MODE === 'otp'){ Object.assign(a, {step:'otp', otp:'', err:'', errors:{}, pendingUid:u.id}); refresh(); toast(`Code sent to +91 ${fmtPhone(a.phone)} (demo: ${DEMO_OTP})`, 'info'); const o = $('#f-otp'); o && o.focus(); return; }
    doLogin('manager', u.id);
  },
  otpFrm(){
    const a = FS.auth;
    if (!showErrors(a, String(a.otp).length === 6 ? {} : {otp:'Enter the 6-digit code'})) return;
    if (a.otp !== DEMO_OTP){ a.err = 'That code is incorrect. Check the SMS and try again.'; refresh(); return; }
    doLogin('manager', a.pendingUid);
  },
  forgotFrm(){
    const a = FS.auth; const em = a.fEmail.trim();
    if (!showErrors(a, !em ? {fEmail:'Enter your email'} : !/^\S+@\S+\.\S+$/.test(em) ? {fEmail:'Enter a valid email address'} : {})) return;
    a.sent = true; refresh();
  },
  dutyFrm(){
    const st = FS.duty; const me = meDriver();
    if (!showErrors(st, validateDuty(st, me))) return;
    const e = saveDuty(st, me); formDirty = false;
    toast(st.editId ? 'Duty updated' : e.status === 'open' ? `Duty started at ${e.st}` : `Duty submitted${e.kmKnown ? ` · ${num(e.km)} km` : ''}`);
    go(st.editId ? 'd/month' : 'd/today');
  },
  closeFrm(f){
    const st = FS.close; const fd = findDuty(f.dataset.id); if (!fd) return; const e = fd.e;
    const fleet = e.vehicleSrc === 'fleet'; const E = {}; const sRaw = e.stRaw || parse12(e.st);
    if (fleet){
      const v = String(st.ek).trim();
      if (!v) E.ek = 'Enter the ending KM'; else if (!/^\d+$/.test(v)) E.ek = 'Use whole numbers only';
      else if (+v < e.sk) E.ek = `Must be more than the starting KM (${num(e.sk)})`; else if (+v - e.sk > 1500) E.ek = 'Over 1,500 km in one duty. Check the reading.';
    }
    if (!st.et) E.et = 'Enter the closing time'; else if (durMins(sRaw, st.et) === 0) E.et = 'Closing time must be after the starting time';
    fuelCheck(st, E);
    if (!showErrors(st, E)) return;
    Object.assign(e, {ek: fleet ? +st.ek : null, km: fleet ? +st.ek - e.sk : 0, kmKnown: fleet, etRaw:st.et, et:hmLabel(st.et), stRaw:sRaw,
      mins:durMins(sRaw, st.et), fuelL:+st.fuelL || 0, fuelAmt:+st.fuelAmt || 0, status:'closed'});
    formDirty = false; toast(`Duty closed${fleet ? ` · ${num(e.km)} km` : ''} · ${fmtMins(e.mins)}`); go('d/today');
  },
  woFrm(){
    const st = FS.wo; const me = meDriver(); const E = {};
    if (!st.date) E.date = 'Pick a date';
    else if (st.date < minEditDate()) E.date = `Dates older than ${EDIT_WINDOW} days can only be changed by admin`;
    else { const es = dayEntries(me.id, st.date);
      if (es.some(e => e.type === 'week_off')) E.date = 'This date is already a week off';
      else if (es.some(e => e.type === 'duty')) E.date = 'You logged a duty on this date. Delete it first if this was a day off.';
      else if (es.some(e => e.type === 'leave') || leaveOn(me.id, st.date)) E.date = 'You are on leave on this date'; }
    if (!showErrors(st, E)) return;
    sortByDate(dutyListFor(me.id, st.date)).push({id:nid(), date:st.date, day:+st.date.slice(8), type:'week_off', src:'app'});
    sortByDate(dutyListFor(me.id, st.date));
    formDirty = false; toast(`Week off marked for ${fmtDate(st.date)}`); go('d/today');
  },
  leaveFrm(){
    const st = FS.lv; const me = meDriver(); const E = {};
    if (!st.from) E.from = 'Pick the first day'; else if (st.from < minEditDate()) E.from = `Dates older than ${EDIT_WINDOW} days can only be changed by admin`;
    if (!st.to) E.to = 'Pick the last day'; else if (st.from && st.to < st.from) E.to = 'The last day must be on or after the first day';
    if (!E.from && !E.to){
      const days = Math.round((new Date(st.to) - new Date(st.from)) / 864e5) + 1;
      if (days > 30) E.to = 'A single request can be up to 30 days';
      else for (let d = st.from; d <= st.to; d = addDays(d, 1)){
        if (dayEntries(me.id, d).some(e => e.type === 'duty')){ E.from = `You have a duty logged on ${fmtDate(d)}`; break; }

      }
    }

    if (String(st.reason).trim().length < 5) E.reason = 'Add a short reason (at least 5 characters)';
    if (!showErrors(st, E)) return;
    db.leaves.push({id:nid(), driverId:me.id, from:st.from, to:st.to, type:st.type, reason:st.reason.trim(), status:'pending', applied:TODAY});

  docFrm(){
    const st = FS.doc; const me = meManager(); const E = {};
    if (!String(st.name).trim()) E.name = 'Enter the doctor name';
    if (st.phone && String(st.phone).length !== 10) E.phone = 'Enter a 10-digit mobile number';
    if (st.email && !/^\S+@\S+\.\S+$/.test(st.email.trim())) E.email = 'Enter a valid email address';
    ['qualification', 'speciality'].forEach(k => { if (st[k] === 'Others' && !String(st[k + 'Other']).trim()) E[k + 'Other'] = `Type the ${k}`; });
    if (!showErrors(st, E)) return;
    const val = k => st[k] === 'Others' ? st[k + 'Other'].trim() : st[k];
    const rec = {name:st.name.trim(), phone:st.phone, email:st.email.trim(), hq:st.hq, hospital:st.hospital.trim(), pharmacy:st.pharmacy.trim(), area:st.area.trim(),
      division:st.division, qualification:val('qualification'), speciality:val('speciality'), notes:st.notes.trim()};
    if (st.id) Object.assign(db.doctors.find(d => d.id === st.id), rec);
    else db.doctors.unshift({id:nid(), managerId:me.id, active:true, ...rec});
    formDirty = false; toast(`${rec.name} ${st.id ? 'updated' : 'added'}`); go('m/doctors');
  },
  svcFrm(){
    const st = FS.svc; const me = meManager();
    if (!showErrors(st, validateSvc(st))) return;
    const draft = db.drafts[me.id];
    const val = k => st[k] === 'Others' ? st[k + 'Other'].trim() : st[k];
    let doctorId = st.doctorId === 'new' ? null : st.doctorId;
    const doctor = st.doctorId === 'new' ? st.doctor.trim() : ((db.doctors.find(d => d.id === st.doctorId) || {}).name || st.doctor);
    if (st.doctorId === 'new' && st.saveDoctor){
      const nd = {id:nid(), name:doctor, phone:'', division:st.division, qualification:val('qualification'), speciality:val('speciality'), hospital:st.hospital.trim(), pharmacy:st.pharmacy.trim(), area:st.area.trim(), hq:st.hq, managerId:me.id, active:true};
      db.doctors.unshift(nd); doctorId = nd.id;
    }
    const item = {date:st.date, doctorId, doctor, area:st.area.trim(), hospital:st.hospital.trim(), pharmacy:st.pharmacy.trim(), hq:st.hq, division:st.division,
      qualification:val('qualification'), speciality:val('speciality'), amount:+st.amount, type:val('type'), expected:+st.expected, current:+st.current, offer:st.offer, offerVal:+st.offerVal};
    if (st.editIdx != null) draft.items[st.editIdx] = item; else draft.items.push(item);
    formDirty = false; toast(st.editIdx != null ? 'Service updated' : `Service added for ${doctor}`); go('m/request');
  },
};

/* binding: <form data-fs="x"> + <input data-bind="key"> keep FS.x in sync; data-refresh re-renders on change */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'doc-q'){
    const s = t.value.trim().toLowerCase(); let n = 0;
    $$('.doc-card').forEach(c => { const ok = c.dataset.s.includes(s); c.hidden = !ok; if (ok) n++; });
    const em = $('#doc-empty'); if (em) em.hidden = n > 0; return;
  }
  const b = t.dataset && t.dataset.bind; if (!b) return;
  const host = t.closest('[data-fs]'); if (!host) return; const fsn = host.dataset.fs; const st = FS[fsn]; if (!st) return;
  if (t.dataset.digits) t.value = t.value.replace(/\D/g, '').slice(0, +t.dataset.digits);
  st[b] = t.type === 'checkbox' ? t.checked : t.value;
  if (fsn !== 'auth') formDirty = true;
  if (st.errors && st.errors[b]){ delete st.errors[b]; const w = t.closest('.field'); if (w){ w.classList.remove('invalid'); const er = w.querySelector('.err'); if (er) er.innerHTML = ''; t.removeAttribute('aria-invalid'); } }
  if (fsn === 'auth' && st.err){ st.err = ''; const fe = $('.auth .form-error'); if (fe) fe.remove(); }
  if (t.hasAttribute('data-live')) liveUpdate(fsn);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dm-month') return go(`d/month?month=${t.value || TODAY.slice(0, 7)}`);
  if (t.hasAttribute && t.hasAttribute('data-refresh') && t.closest('[data-fs]')) refresh();
});

render();
</script>
</body>
</html>
